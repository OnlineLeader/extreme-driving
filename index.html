<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#0b0d12; touch-action:none;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:#e8ecf5; user-select:none; }
canvas { display:block; width:100%; height:100%; }

/* ---------- ЭКРАНЫ ---------- */
.screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; z-index:20; padding:20px;
  background:radial-gradient(ellipse at 50% 35%, #1b2233 0%, #0b0d12 70%); }
.screen.on { display:flex; }

.logo { font-size:clamp(34px,8vw,74px); font-weight:900; letter-spacing:2px; line-height:.92;
  text-align:center; color:#ffd23f; text-shadow:0 0 26px rgba(255,180,40,.55), 0 5px 0 #a8681a;
  transform:skewX(-6deg); }
.logo small { display:block; font-size:.45em; color:#fff; letter-spacing:6px;
  text-shadow:0 0 18px rgba(120,190,255,.6); }
.sub { color:#8ea0bd; font-size:14px; letter-spacing:1px; text-align:center; }

.btn { min-width:230px; padding:14px 26px; border:none; border-radius:12px; cursor:pointer;
  font-family:inherit; font-size:19px; font-weight:800; letter-spacing:1px; color:#fff;
  background:linear-gradient(#3d84f7,#1f57c4); box-shadow:0 4px 0 #143a86, 0 8px 22px rgba(0,0,0,.5);
  transition:transform .06s, filter .12s; }
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 #143a86; }
.btn.y { background:linear-gradient(#ffc93c,#f0930d); box-shadow:0 4px 0 #a05c05,0 8px 22px rgba(0,0,0,.5); color:#20160a; }
.btn.g { background:linear-gradient(#49d16b,#1f9c43); box-shadow:0 4px 0 #13692c,0 8px 22px rgba(0,0,0,.5); }
.btn.sm { min-width:auto; padding:10px 18px; font-size:15px; }
.row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

.card { background:rgba(20,26,40,.9); border:1px solid #2b3550; border-radius:16px;
  padding:20px 26px; max-width:560px; width:100%; }
.card h2 { font-size:22px; margin-bottom:12px; color:#ffd23f; letter-spacing:1px; }
.line { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed #2b3550; font-size:17px; }
.line:last-child { border:none; }
.line b { color:#ffd23f; }

/* ---------- HUD ---------- */
#hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
#hud.on { display:block; }
.pill { position:absolute; top:12px; background:rgba(10,14,22,.72); border:1px solid #2b3550;
  border-radius:11px; padding:7px 13px; font-size:15px; font-weight:800; letter-spacing:.5px;
  backdrop-filter:blur(6px); }
#pTime { left:50%; transform:translateX(-50%); color:#fff; font-size:19px; }
#pP1 { left:12px; color:#5fd0ff; }
#pP2 { right:12px; color:#ff8a5c; }
.hpbar { width:74px; height:5px; background:#2a3247; border-radius:3px; margin-top:5px; overflow:hidden; }
.hpbar i { display:block; height:100%; background:#49d16b; transition:width .12s, background .12s; }
#btnPause { position:absolute; top:12px; right:12px; pointer-events:auto; }
#hint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); color:#7e8ca8;
  font-size:13px; text-align:center; }

function resize(){

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* Тач: левая половина экрана — стик игрока 1, правая — игрока 2.
   Долгое касание в нижнем углу своей половины = турбо. */
const touch = [ {act:false,dx:0,dy:0,turbo:false}, {act:false,dx:0,dy:0,turbo:false} ];
const tPts = {};
function tSide(x){ return (game.players===2 && x > W/2) ? 1 : 0; }
function tStart(id,x,y){
  const s = tSide(x);
  if (y > H*0.72 && ((s===0 && x < W*0.16) || (s===1 && x > W*0.84))) {
    touch[s].turbo = true; tPts[id] = {s, turbo:true}; return;
  }
  tPts[id] = {s, ox:x, oy:y, turbo:false}; touch[s].act = true; touch[s].dx=0; touch[s].dy=0;
}
function tMove(id,x,y){
  const p = tPts[id]; if(!p || p.turbo) return;
  const dx=x-p.ox, dy=y-p.oy, l=Math.hypot(dx,dy);
  if (l > 6){ touch[p.s].dx = dx/l; touch[p.s].dy = dy/l; }
}
function tEnd(id){
  const p = tPts[id]; if(!p) return;
  if (p.turbo) touch[p.s].turbo=false; else { touch[p.s].act=false; touch[p.s].dx=0; touch[p.s].dy=0; }
  delete tPts[id];
}
cv.addEventListener('touchstart',e=>{ e.preventDefault();
  for(const t of e.changedTouches) tStart(t.identifier,t.clientX,t.clientY); },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault();
  for(const t of e.changedTouches) tMove(t.identifier,t.clientX,t.clientY); },{passive:false});
cv.addEventListener('touchend',e=>{ for(const t of e.changedTouches) tEnd(t.identifier); });
cv.addEventListener('touchcancel',e=>{ for(const t of e.changedTouches) tEnd(t.identifier); });

  const o = { up:0, down:0, turn:0, turbo:false, dx:0, dy:0, dir:false };
  // когда играет один — слушаем и WASD, и стрелки сразу
  const maps = (game.players===1 && i===0) ? KEYMAP : [KEYMAP[i]];
  for (const k of maps){
    if (keys[k.up]) o.up=1; if (keys[k.down]) o.down=1;
    if (keys[k.left]) o.turn-=1; if (keys[k.right]) o.turn+=1;
    if (keys[k.turbo]) o.turbo=true;
  }
  if (i===0 && keys.Space) o.turbo=true;
  if (o.up||o.down||o.turn){ o.dir=true; o.dx = o.turn; o.dy = (o.down?1:0)-(o.up?1:0); }
  const t = touch[i];
  if (t.act){ o.dir=true; o.dx=t.dx; o.dy=t.dy; o.up=1; }
  if (t.turbo) o.turbo=true;
  return o;
}

/* ---------------- ЧАСТИЦЫ ---------------- */
const parts = [];
function spark(x,y,n,col,pow){
  if(!S.ЧАСТИЦЫ) return;
  for(let i=0;i<n;i++){ const a=rnd(0,6.283), s=rnd(.6,3.4)*pow;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:rnd(.02,.05),
                col,r:rnd(1.6,3.6),g:0}); }
}
function smoke(x,y,col){
  if(!S.ЧАСТИЦЫ) return;
  parts.push({x,y,vx:rnd(-.3,.3),vy:rnd(-.3,.3),life:1,dec:.016,col,r:rnd(5,11),g:1});
}
function updParts(){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=.94; p.vy*=.94; p.life-=p.dec;
    if(p.g) p.r+=.35;
    if(p.life<=0) parts.splice(i,1); }
}

/* Следы шин — рисуем на отдельном холсте, который живёт весь бой */
let skid=null, skidCtx=null;
function initSkid(a){
  skid = document.createElement('canvas'); skid.width=a.w; skid.height=a.h;
  skidCtx = skid.getContext('2d');
}
function addSkid(x,y,r,al){
  if(!S.СЛЕДЫ_ШИН||!skidCtx) return;
  skidCtx.fillStyle='rgba(0,0,0,'+al+')';
  skidCtx.beginPath(); skidCtx.arc(x,y,r,0,6.283); skidCtx.fill();
}

/* ---------------- МАШИНА ---------------- */
class Car {
  constructor(o){
    this.x=o.x; this.y=o.y; this.a=o.a||0;
    this.vx=0; this.vy=0; this.sp=0;
    this.def = o.def;
    this.color = o.color || o.def.color;
    this.isBot = !!o.bot; this.brain = o.brain || null;
    this.pi = o.pi ?? -1;                 // индекс игрока (-1 = бот)
    this.name = o.name || o.def.name;
    const u = o.up || {spd:0,acc:0,hp:0,turbo:0};
    this.mSpd = o.def.spd * (1 + u.spd*0.09);
    this.mAcc = o.def.acc * (1 + u.acc*0.09);
    this.maxHp = S.ЗДОРОВЬЕ * o.def.hp * (1 + u.hp*0.12);
    this.hp = this.maxHp;
    this.turbo = S.ТУРБО_ЗАПАС * (1 + u.turbo*0.15);
    this.maxTurbo = this.turbo;
    this.score=0; this.dead=0;
    this.l = o.def.len || 60; this.w = o.def.wid || 34;
    this.r = (this.l + this.w) * 0.27;      // радиус столкновений под размер кузова
    this.wob=0; this.boosting=false;
    // состояние для режимов ГОНКА / ИСПЫТАНИЯ
    this.cp=0; this.lap=0; this.finished=false; this.finishFrame=0; this.place=0;
  }
  drive(inp){
    if(this.dead>0) return;
    const maxS = S.МАКС_СКОРОСТЬ * this.mSpd * (inp.turbo && this.turbo>0 ? S.ТУРБО_СИЛА : 1);
    this.boosting = inp.turbo && this.turbo>0 && this.sp>0.4;
    if (inp.turbo && this.turbo>0) this.turbo -= S.ТУРБО_РАСХОД;
    else this.turbo = Math.min(this.maxTurbo, this.turbo + S.ТУРБО_ВОССТАН);

    if (S.ПРОСТОЕ_УПРАВЛЕНИЕ || this.isBot){
      // рулим в сторону нажатого направления, газ автоматически.
      // ВНИЗ — это «ехать вниз», а не тормоз: иначе машина вставала на месте.
      if (inp.dir && (inp.dx||inp.dy)){
        const want = Math.atan2(inp.dy, inp.dx);
        const turnRate = S.ПОВОРОТ * (1.4 - Math.min(this.sp/maxS,1)*0.45);
        this.a = angLerp(this.a, want, clamp(turnRate*2.4,0,1));
        this.sp += S.РАЗГОН * this.mAcc * (inp.boost||1);
      } else this.sp *= 0.96;
    } else {
      // классика: газ / тормоз / руль
      if (inp.up) this.sp += S.РАЗГОН * this.mAcc;
      if (inp.down) this.sp -= S.ТОРМОЗ;
      if (inp.turn) this.a += inp.turn * S.ПОВОРОТ * clamp(Math.abs(this.sp)/1.4,0,1.5) * Math.sign(this.sp||1);
      if (!inp.up && !inp.down) this.sp *= 0.985;
    }
    this.sp = clamp(this.sp, -maxS*0.45, maxS);

    // занос: скорость по вектору тянется к направлению корпуса
    const tx = Math.cos(this.a)*this.sp, ty = Math.sin(this.a)*this.sp;
    const grip = S.ЦЕПКОСТЬ;
    this.vx = lerp(this.vx, tx, grip); this.vy = lerp(this.vy, ty, grip);
    this.vx *= S.ТРЕНИЕ; this.vy *= S.ТРЕНИЕ;
    this.x += this.vx; this.y += this.vy;

    // визуальные эффекты движения
    const slip = Math.hypot(this.vx-tx, this.vy-ty);
    if (slip > 0.55 || this.boosting){
      const bx = this.x - Math.cos(this.a)*16, by = this.y - Math.sin(this.a)*16;
      addSkid(bx + Math.cos(this.a+1.57)*9, by + Math.sin(this.a+1.57)*9, 4.2, .05);
      addSkid(bx - Math.cos(this.a+1.57)*9, by - Math.sin(this.a+1.57)*9, 4.2, .05);
      if (Math.random()<.5) smoke(bx, by, this.boosting?'255,160,60':'190,190,200');
    }
    this.slip = slip;                       // нужен для визга шин
    this.wob = lerp(this.wob, slip*0.05, 0.2);
  }
  damage(d, fx, fy){
    if(this.dead>0) return;
    this.hp -= d;
    spark(fx,fy, Math.min(22, 5+d|0), '255,210,90', 1+d/22);
    if (this.hp<=0){
      this.hp=0; this.dead = S.РЕСПАВН_СЕК*60;
      spark(this.x,this.y,34,'255,140,40',2.4);
      for(let i=0;i<7;i++) smoke(this.x+rnd(-14,14), this.y+rnd(-14,14), '60,60,66');
      shake(16); freeze(120); sfx('boom', 1.4);
    }
  }
  respawn(a){
    this.hp=this.maxHp; this.dead=0; this.sp=0; this.vx=this.vy=0;
    this.x=rnd(a.w*0.2,a.w*0.8); this.y=rnd(a.h*0.2,a.h*0.8);
  }
}

/* ---------------- БОТЫ ---------------- */
/* Один мозг, три характера. Меняй числа — меняется поведение соперников. */
const BRAINS = [
  // aggr — напор, aim — точность прицела, react — скорость решений,
  // turboAt — с какой дистанции идут на таран, keep — при каком здоровье отступают
  { name:'ТАРАН',  aggr:1.00, aim:0.88, react:0.45, turboAt:260, keep:0.12 },
  { name:'ХИТРЫЙ', aggr:0.86, aim:0.98, react:0.62, turboAt:190, keep:0.32 },
  { name:'ОХОТНИК',aggr:0.92, aim:0.94, react:0.52, turboAt:230, keep:0.22 },
];

function avoidObstacles(bot, world, dx, dy){
  // смотрим в две точки по курсу — близкую и дальнюю, поэтому объезд начинается заранее
  for (const look of [46, 96]){
    const fx = bot.x + Math.cos(bot.a)*look, fy = bot.y + Math.sin(bot.a)*look;
    for (const o of world.arena.obs){
      const od = Math.hypot(fx-o[0], fy-o[1]);
      if (od < o[2] + bot.r + 18){
        const ax = (fx-o[0])/(od||1), ay = (fy-o[1])/(od||1);
        const k = (look===46 ? 3.2 : 1.6);
        dx += ax*k; dy += ay*k;
      }
    }
  }
  // Стены: не отталкиваемся в лоб (от этого боты наматывали круги вдоль борта),
  // а СКОЛЬЗИМ вдоль стены в сторону цели — как настоящий водитель у отбойника.
  const A = world.arena, near = 130;
  const walls = [];
  if (bot.x < near)       walls.push([ 1, 0, (near-bot.x)/near]);
  if (bot.x > A.w-near)   walls.push([-1, 0, (bot.x-(A.w-near))/near]);
  if (bot.y < near)       walls.push([ 0, 1, (near-bot.y)/near]);
  if (bot.y > A.h-near)   walls.push([ 0,-1, (bot.y-(A.h-near))/near]);
  for (const [nx, ny, force] of walls){
    const into = dx*nx + dy*ny;              // проекция курса на нормаль стены
    if (into < 0){                           // курс ведёт В стену — гасим эту составляющую
      dx -= nx*into; dy -= ny*into;
    }
    dx += nx*force*1.2; dy += ny*force*1.2;  // мягкий увод от борта
  }
  return {dx,dy};
}

/* Разблокировка. Ловим два вида залипания:
   1) бот буксует на месте;
   2) бот ездит, но не приближается к цели — то самое бесконечное кружение у стены. */
function unstick(bot, world, inp, target){
  const moving = Math.hypot(bot.vx, bot.vy);
  if (moving < 0.6) bot._stuck = (bot._stuck||0) + 1; else bot._stuck = 0;

  // прогресс к цели: если за 2 секунды не стало ближе — считаем, что кружим
  if (target){
    const d = Math.hypot(target.x-bot.x, target.y-bot.y);
    bot._progT = (bot._progT||0) + 1;
    if (bot._bestD === undefined || d < bot._bestD - 12){ bot._bestD = d; bot._progT = 0; }
    if (bot._progT > 120){ bot._loop = 1; bot._progT = 0; bot._bestD = undefined; }
  }

  if (bot._stuck > 22 || bot._loop){
    bot._escape = bot._loop ? 55 : 40;
    bot._escapeSide = Math.random()<0.5 ? 1 : -1;
    bot._stuck = 0; bot._loop = 0;
  }

  if (bot._escape > 0){
    bot._escape--;
    const A = world.arena;
    // уходим к центру арены — оттуда всегда есть выезд, в отличие от «назад»
    let ex = A.w/2 - bot.x, ey = A.h/2 - bot.y;
    const el = Math.hypot(ex,ey)||1; ex/=el; ey/=el;
    // с доворотом в бок, чтобы не толкаться лоб в лоб с тем, кто прижал
    const s = bot._escapeSide;
    inp.dir = true;
    inp.dx = ex*0.82 - ey*s*0.58;
    inp.dy = ey*0.82 + ex*s*0.58;
    inp.turbo = false; inp.boost = 1.25;
  }
  return inp;
}

function botThink(bot, world){
  if (world.modeType !== 'combat') return botThinkRace(bot, world);

  const b = bot.brain;
  bot._t = (bot._t||0) - 1;
  if (bot._t <= 0){                     // «время реакции» — думает не каждый кадр
    bot._t = Math.round(3 + (1-b.react)*14);
    // выбор жертвы: ближе — лучше, раненый — гораздо лучше, игрок — приоритет
    let best=null, bs=-1e9;
    for (const c of world.cars){
      if (c===bot || c.dead>0) continue;
      const d = dist(bot,c);
      let score = 1000 - d;                       // ближних предпочитаем
      score += (1 - c.hp/c.maxHp) * 700;          // добиваем подранков
      if (c.pi>=0) score += 350;                  // за игроком охотятся охотнее
      if (c.sp < 1.2) score += 180;               // стоящий — лёгкая добыча
      if (score > bs){ bs = score; best = c; }
    }
    bot._target = best;

    if (best){
      // упреждение: куда цель приедет, пока мы доедем
      const d = dist(bot, best);
      const lead = clamp(d / (S.МАКС_СКОРОСТЬ*1.4), 6, 34) * b.aim;
      let tx = best.x + best.vx*lead, ty = best.y + best.vy*lead;

      const scared = bot.hp < bot.maxHp*b.keep;
      if (scared){
        // отступаем, но не тупо назад — по дуге, чтобы восстановить турбо и вернуться
        const ax = bot.x - best.x, ay = bot.y - best.y, al = Math.hypot(ax,ay)||1;
        tx = bot.x + (ax/al)*300 - (ay/al)*220;
        ty = bot.y + (ay/al)*300 + (ax/al)*220;
      } else if (d > 150){
        // заходим сбоку от курса жертвы: удар в борт снимает больше здоровья
        const vlen = Math.hypot(best.vx, best.vy);
        if (vlen > 0.8){
          const side = ((bot.x-best.x)*(-best.vy) + (bot.y-best.y)*(best.vx)) > 0 ? 1 : -1;
          tx += (-best.vy/vlen) * side * 70;
          ty += ( best.vx/vlen) * side * 70;
        }
      }
      bot._aim = { x:tx, y:ty, scared };
    }
  }

  const inp = { dir:false, dx:0, dy:0, up:1, down:0, turn:0, turbo:false, brake:false, boost:1 };
  // цели нет — не стоим столбом, а патрулируем центр арены
  const aim = bot._aim || { x: world.arena.w/2 + Math.sin(world.frame/90 + bot.x)*260,
                            y: world.arena.h/2 + Math.cos(world.frame/90 + bot.y)*220, scared:false };

  let dx = aim.x - bot.x, dy = aim.y - bot.y;
  const d = Math.hypot(dx,dy) || 1; dx/=d; dy/=d;
  ({dx,dy} = avoidObstacles(bot, world, dx, dy));

  const nl = Math.hypot(dx,dy)||1;
  inp.dir=true; inp.dx=dx/nl; inp.dy=dy/nl;
  inp.boost = 1.0 + b.aggr*0.45;
  // турбо — на разгоне в таран, когда цель уже перед носом
  const nose = Math.cos(bot.a)*dx + Math.sin(bot.a)*dy;
  if (!aim.scared && d < b.turboAt && nose > 0.42 && bot.turbo > 18) inp.turbo = true;
  if (aim.scared && bot.turbo > 35) inp.turbo = true;
  return unstick(bot, world, inp, bot._target || aim);
}

/* Боты в ГОНКЕ и ИСПЫТАНИЯХ едут по чекпоинтам трассы, а не друг за другом */
function botThinkRace(bot, world){
  const inp = { dir:false, dx:0, dy:0, up:1, down:0, turn:0, turbo:false, brake:false, boost:1 };
  if (bot.finished) return inp;
  const circ = world.circuit, n = circ.length;
  const cp = circ[bot.cp % n], nx = circ[(bot.cp+1) % n];
  // срезаем угол: целимся между текущим чекпоинтом и следующим
  const near = dist(bot, {x:cp[0], y:cp[1]}) < S.РАДИУС_ЧЕКПОИНТА*2.2;
  const tx = near ? (cp[0]*0.35 + nx[0]*0.65) : cp[0];
  const ty = near ? (cp[1]*0.35 + nx[1]*0.65) : cp[1];
  let dx = tx - bot.x, dy = ty - bot.y;
  ({dx,dy} = avoidObstacles(bot, world, dx, dy));
  const nl = Math.hypot(dx,dy)||1;
  inp.dir=true; inp.dx=dx/nl; inp.dy=dy/nl;
  inp.boost = 1.0 + bot.brain.aggr*0.3;
  // турбо только когда нос смотрит на цель — иначе улетают с трассы
  const nose = Math.cos(bot.a)*(dx/nl) + Math.sin(bot.a)*(dy/nl);
  if (bot.turbo > 30 && nose > 0.75) inp.turbo = true;
  return unstick(bot, world, inp, {x:tx, y:ty});
}

/* ---------------- КАМЕРА / ТРЯСКА / СТОП-КАДР ---------------- */
const cam = { x:0, y:0, z:1, tz:1, sh:0, punch:0, rot:0 };
/* камера крутится за машиной только в одиночной игре */
function chaseOn(){ return false; }   // поворот камеры отключён: переворачивал экран
let freezeUntil = 0;
function shake(v){
  cam.sh = Math.min(26, cam.sh + v*S.ТРЯСКА);
  cam.punch = Math.min(0.22, cam.punch + v*S.ТОЛЧОК_КАМЕРЫ*0.05);
}
function freeze(ms){ if(S.ЗАМОРОЗКА_УДАРА) freezeUntil = performance.now() + Math.min(ms, S.ЗАМОРОЗКА_УДАРА*1.8); }

function updCam(){
  const foc = game.cars.filter(c=>c.pi>=0 && c.dead<=0);
  const list = foc.length ? foc : game.cars.filter(c=>c.pi>=0);
  if(!list.length) return;
  let cx=0, cy=0, vx=0, vy=0, minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(const c of list){ cx+=c.x; cy+=c.y; vx+=c.vx; vy+=c.vy;
    minx=Math.min(minx,c.x); maxx=Math.max(maxx,c.x);
    miny=Math.min(miny,c.y); maxy=Math.max(maxy,c.y); }
  const n=list.length; cx/=n; cy/=n; vx/=n; vy/=n;

  // камера за машиной: доворачиваем сцену так, чтобы машина всегда ехала «от нас»
  if (chaseOn()){
    const c0 = list[0];
    const want = -(c0.a) - Math.PI/2;                 // нос машины смотрит вверх экрана
    cam.rot = angLerp(cam.rot, want, S.ПОВОРОТ_ПЛАВНОСТЬ);
    cx = c0.x + Math.cos(c0.a)*S.ОТСТУП_НАЗАД*0.45;   // смотрим чуть вперёд по курсу
    cy = c0.y + Math.sin(c0.a)*S.ОТСТУП_НАЗАД*0.45;
  } else {
    cam.rot = lerp(cam.rot, 0, 0.1);
    // камера смотрит вперёд по ходу движения — видно куда едешь, а не откуда
    cx += vx * S.КАМЕРА_ВПЕРЁД;
    cy += vy * S.КАМЕРА_ВПЕРЁД;
  }

  const spread = Math.max(maxx-minx, (maxy-miny)*1.4) + 620;
  const speed = Math.hypot(vx,vy);
  // на скорости отъезжаем (шире обзор), при ударе — короткий рывок ближе
  const zoomOut = 1 + speed * S.ЗУМ_ОТ_СКОРОСТИ;
  cam.tz = clamp(Math.min(W,H*1.3)/spread/zoomOut, S.ЗУМ_МИН, S.ЗУМ_МАКС) * (1 + cam.punch);
  cam.z = lerp(cam.z, cam.tz, 0.1);
  cam.x = lerp(cam.x, cx, S.КАМЕРА_ПЛАВНОСТЬ);
  cam.y = lerp(cam.y, cy, S.КАМЕРА_ПЛАВНОСТЬ);
  // не выпускаем камеру далеко за пределы арены (немного захвата декора — можно).
  // по вертикали мир сплющен наклоном, поэтому границу считаем с поправкой на него
  const A=game.arena, T=S.НАКЛОН, hw=W/2/cam.z, hh=H/2/cam.z/T, out=130;
  if (A.w+out*2 > hw*2) cam.x = clamp(cam.x, hw-out, A.w-hw+out); else cam.x = A.w/2;
  if (A.h+out*2 > hh*2) cam.y = clamp(cam.y, hh-out, A.h-hh+out); else cam.y = A.h/2;
  cam.sh *= 0.88;
  cam.punch *= 0.82;
}

/* ---------------- ЗВУК ----------------
   Всё синтезируется кодом, ни одного файла. Мотор — не писк приставки,
   а слоёный звук: низ блока цилиндров + гармоники + рык выхлопа + шум турбины. */
let AC=null, master=null, ENG=null, SKID=null, noiseBuf=null;

function makeNoise(){
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
}
function noiseSource(loop){
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = !!loop; return s;
}

function audio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
    makeNoise();

    // ----- ДВИГАТЕЛЬ -----
    const g = AC.createGain(); g.gain.value = 0;
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; lp.Q.value=6;
    lp.connect(g); g.connect(master);

    // спектр реального мотора: сильные низкие гармоники + затухающие верхние.
    // именно набор гармоник даёт «рык», а не гудение генератора
    const N = 22, re = new Float32Array(N), im = new Float32Array(N);
    for (let i=1;i<N;i++){
      const odd = i%2 ? 1 : 0.55;                       // нечётные громче — как в ДВС
      re[i] = 0; im[i] = (1/Math.pow(i,1.12)) * odd;
    }
    const ENGWAVE = AC.createPeriodicWave(re, im, {disableNormalization:false});

    // низ — тяжёлый блок
    const o1 = AC.createOscillator(); o1.setPeriodicWave(ENGWAVE); o1.frequency.value=55;
    const g1 = AC.createGain(); g1.gain.value=0.55; o1.connect(g1); g1.connect(lp);
    // гармоника — характер мотора
    const o2 = AC.createOscillator(); o2.type='square'; o2.frequency.value=110;
    const g2 = AC.createGain(); g2.gain.value=0.16; o2.connect(g2); g2.connect(lp);
    // расстроенная пила — «неровность» работы
    const o3 = AC.createOscillator(); o3.setPeriodicWave(ENGWAVE); o3.frequency.value=57;
    const g3 = AC.createGain(); g3.gain.value=0.3; o3.connect(g3); g3.connect(lp);
    // шум впуска/турбины
    const nz = noiseSource(true);
    const nf = AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=900; nf.Q.value=1.2;
    const ng = AC.createGain(); ng.gain.value=0.05;
    nz.connect(nf); nf.connect(ng); ng.connect(g);

    o1.start(); o2.start(); o3.start(); nz.start();
    ENG = { g, lp, o1, o2, o3, ng };

    // ----- ВИЗГ ШИН (постоянный источник, громкость по заносу) -----
    const sn = noiseSource(true);
    const sf = AC.createBiquadFilter(); sf.type='bandpass'; sf.frequency.value=2400; sf.Q.value=7;
    const sg = AC.createGain(); sg.gain.value = 0;
    sn.connect(sf); sf.connect(sg); sg.connect(master); sn.start();
    SKID = { g:sg, f:sf };
  } catch(e){}
}

/* rpm 0..1 — обороты, boost — турбо, skid — насколько срывает в занос */
function engine(sp, boost, skid){
  if(!AC||!ENG) return;
  const on = game.state==='play';
  const rpm = clamp(sp/6, 0, 1.35);
  const base = 30 + rpm*62 + (boost?12:0);
  const t = AC.currentTime, S1 = 0.08;
  ENG.o1.frequency.setTargetAtTime(base,        t, S1);
  ENG.o2.frequency.setTargetAtTime(base*0.5,    t, S1);
  ENG.o3.frequency.setTargetAtTime(base*1.007,  t, S1);   // биения между пилами = живой рык
  ENG.lp.frequency.setTargetAtTime(240 + rpm*950 + (boost?420:0), t, 0.1);
  ENG.ng.gain.setTargetAtTime(on ? (0.04 + rpm*0.09 + (boost?0.1:0)) : 0, t, 0.1);
  ENG.g.gain.setTargetAtTime(on ? (0.05 + rpm*0.11) : 0, t, 0.12);
  if (SKID){
    SKID.g.gain.setTargetAtTime(on ? clamp(skid,0,1)*0.11 : 0, t, 0.05);
    SKID.f.frequency.setTargetAtTime(1900 + clamp(skid,0,1)*1400, t, 0.05);
  }
}

function sfx(kind, power){
  if(!AC) return;
  const t = AC.currentTime;

  if (kind==='hit' || kind==='boom'){
    const big = kind==='boom';
    const p = clamp(power||1, 0.4, 2.2);

    // удар корпуса — низкий «бух» с падением тона
    const o = AC.createOscillator(); o.type='sine';
    const og = AC.createGain();
    o.frequency.setValueAtTime(big?90:150, t);
    o.frequency.exponentialRampToValueAtTime(big?32:52, t + (big?0.5:0.17));
    og.gain.setValueAtTime((big?0.75:0.34)*p, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + (big?0.6:0.2));
    o.connect(og); og.connect(master); o.start(t); o.stop(t + (big?0.65:0.24));

    // металл: шум сквозь резонанс — звук мнущегося железа
    const n = noiseSource(false);
    const bp = AC.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime(big?1100:2100, t);
    bp.frequency.exponentialRampToValueAtTime(big?300:700, t + (big?0.45:0.15));
    bp.Q.value = big?1.1:2.4;
    const ng2 = AC.createGain();
    ng2.gain.setValueAtTime((big?0.5:0.28)*p, t);
    ng2.gain.exponentialRampToValueAtTime(0.001, t + (big?0.55:0.18));
    n.connect(bp); bp.connect(ng2); ng2.connect(master);
    n.start(t); n.stop(t + (big?0.6:0.2));

    // у взрыва — ещё низкочастотный «пуф»
    if (big){
      const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260;
      const n2 = noiseSource(false); const g2 = AC.createGain();
      g2.gain.setValueAtTime(0.6, t); g2.gain.exponentialRampToValueAtTime(0.001, t+0.75);
      n2.connect(lp); lp.connect(g2); g2.connect(master); n2.start(t); n2.stop(t+0.8);
    }
  } else if (kind==='coin'){
    // мягкий двойной тон вместо квадратного писка
    [880, 1320].forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='triangle'; o.frequency.value=f;
      const st = t + i*0.07;
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(0.16, st+0.012);
      g.gain.exponentialRampToValueAtTime(0.001, st+0.34);
      o.connect(g); g.connect(master); o.start(st); o.stop(st+0.36);
    });
  }
}

/* ---------------- ФИЗИКА СТОЛКНОВЕНИЙ ---------------- */
function collide(world){
  const cars = world.cars, A = world.arena;
  for (let i=0;i<cars.length;i++){
    const a = cars[i]; if (a.dead>0) continue;

    // стены
    if (a.x < a.r){ a.x=a.r; a.vx=Math.abs(a.vx)*0.4; a.sp*=0.6; wallFx(a); }
    if (a.x > A.w-a.r){ a.x=A.w-a.r; a.vx=-Math.abs(a.vx)*0.4; a.sp*=0.6; wallFx(a); }
    if (a.y < a.r){ a.y=a.r; a.vy=Math.abs(a.vy)*0.4; a.sp*=0.6; wallFx(a); }
    if (a.y > A.h-a.r){ a.y=A.h-a.r; a.vy=-Math.abs(a.vy)*0.4; a.sp*=0.6; wallFx(a); }

    // препятствия
    for (const o of A.obs){
      const dx=a.x-o[0], dy=a.y-o[1], d=Math.hypot(dx,dy), min=a.r+o[2];
      if (d < min && d>0){
        const nx=dx/d, ny=dy/d, pen=min-d;
        a.x+=nx*pen; a.y+=ny*pen;
        const vn = a.vx*nx + a.vy*ny;
        if (vn<0){ a.vx-=vn*nx*1.5; a.vy-=vn*ny*1.5;
          const f=Math.abs(vn);
          if (f>S.УРОН_ПОРОГ){
            if (game.modeType==='combat') a.damage(f*S.УРОН_СИЛА*0.35, a.x-nx*a.r, a.y-ny*a.r);
            else spark(a.x-nx*a.r, a.y-ny*a.r, 6, '255,210,90', 1);
            shake(f*1.2); sfx('hit', f*0.7); }
          a.sp *= 0.55; }
      }
    }

    // машина об машину
    for (let j=i+1;j<cars.length;j++){
      const b = cars[j]; if (b.dead>0) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r;
      if (d < min && d > 0){
        const nx=dx/d, ny=dy/d, pen=(min-d)/2;
        a.x-=nx*pen; a.y-=ny*pen; b.x+=nx*pen; b.y+=ny*pen;

        const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
        const closing = -(rvx*nx + rvy*ny);          // скорость сближения
        if (closing > 0){
          const imp = closing * S.ОТСКОК * 0.5;
          a.vx -= nx*imp; a.vy -= ny*imp; b.vx += nx*imp; b.vy += ny*imp;
          a.sp *= 0.65; b.sp *= 0.65;

          if (closing > S.УРОН_ПОРОГ){
            const power = closing - S.УРОН_ПОРОГ;
            const hx=(a.x+b.x)/2, hy=(a.y+b.y)/2;

            if (game.modeType==='combat'){
              // кто врезался носом — тот бьёт сильнее
              const aFace = Math.cos(a.a)*nx + Math.sin(a.a)*ny;      //  1 = а едет носом в b
              const bFace = -(Math.cos(b.a)*nx + Math.sin(b.a)*ny);
              const aDmg = power * S.УРОН_СИЛА * clamp(0.35 + bFace*0.9, 0.2, 1.5);
              const bDmg = power * S.УРОН_СИЛА * clamp(0.35 + aFace*0.9, 0.2, 1.5);
              const bHpBefore=b.hp, aHpBefore=a.hp;
              b.damage(bDmg, hx, hy); a.damage(aDmg, hx, hy);
              a.score += Math.round(Math.min(bDmg,bHpBefore) * S.ОЧКИ_ЗА_УРОН/10);
              b.score += Math.round(Math.min(aDmg,aHpBefore) * S.ОЧКИ_ЗА_УРОН/10);
            }

            shake(power*2.6); freeze(power*45); sfx('hit', power*0.9);
            spark(hx,hy, 10+Math.min(20,power*8|0), '255,235,140', 1+power);
          }
        }
      }
    }
  }
}
function wallFx(a){
  const f = Math.hypot(a.vx,a.vy);
  if (f > S.УРОН_ПОРОГ*1.4){
    if (game.modeType==='combat') a.damage(f*S.УРОН_СИЛА*0.2, a.x, a.y);
    else spark(a.x, a.y, 5, '255,210,90', 1);
    shake(f); sfx('hit', f*0.55);
  }
}

/* ---------------- ПРОХОЖДЕНИЕ ЧЕКПОИНТОВ (ГОНКА / ИСПЫТАНИЯ) ---------------- */
function raceProgress(world){
  const circuit = world.circuit; if (!circuit) return;
  for (const c of world.cars){
    if (c.dead>0 || c.finished) continue;
    const target = circuit[c.cp % circuit.length];
    if (dist(c, {x:target[0], y:target[1]}) < S.РАДИУС_ЧЕКПОИНТА){
      c.cp++;
      spark(target[0], target[1], 10, '160,220,255', 1);
      if (world.modeType==='race'){
        if (c.cp % circuit.length === 0){
          c.lap++;
          if (c.lap >= S.КРУГОВ_В_ГОНКЕ){ c.finished=true; c.finishFrame=world.frame; }
        }
      } else {                                   // trial: одна разомкнутая трасса
        if (c.cp >= circuit.length){ c.finished=true; c.finishFrame=world.frame; }
      }
      if (c.finished) sfx('coin');
    }
  }
}

/* ---------------- ОТРИСОВКА ---------------- */

/* Декор арены генерируется один раз при старте — с фиксированным зерном,
   поэтому картинка не дрожит и каждый раз одинаковая. */
function seeded(seed){ let s=seed; return ()=> (s = s*16807 % 2147483647) / 2147483647; }

function buildDeco(A){
  const R = seeded(A.w * 7919 + A.h);
  const d = { patches:[], props:[], marks:[] };

  // пятна на покрытии — «жизнь» поля
  for (let i=0;i<16;i++){
    d.patches.push({ x:R()*A.w, y:R()*A.h, r:26+R()*54, a:0.05+R()*0.06 });
  }

  // разметка на полу: стрелки, масляные лужи, граффити-мазки
  for (let i=0;i<7;i++){
    d.marks.push({ t:'arrow', x:120+R()*(A.w-240), y:120+R()*(A.h-240), rot:R()*6.283, s:0.8+R()*0.6 });
  }
  for (let i=0;i<5;i++){
    d.marks.push({ t:'oil', x:100+R()*(A.w-200), y:100+R()*(A.h-200), r:22+R()*30 });
  }
  if (A.theme==='city') for (let i=0;i<6;i++){
    d.marks.push({ t:'paint', x:100+R()*(A.w-200), y:100+R()*(A.h-200), rot:R()*6.283,
      w:70+R()*120, c:['#35e0ff','#ffc93c','#ff5a5a','#49d16b'][(R()*4)|0] });
  }

  // объекты снаружи арены — вразнобой, не по линейке
  const put = (x,y,kind,rot)=>{
    const p = {x, y, kind, rot:rot||0, s: kind==='stand' ? 1 : 0.75+R()*0.6};
    if (kind==='stand') p.crowd = Array.from({length:16},()=>({ dx:(R()-.5)*80, dy:(R()-.5)*40,
      c:['#ff5a5a','#ffd23f','#5fd0ff','#8b5cf6','#49d16b','#fff'][(R()*6)|0] }));
    d.props.push(p);
  };
  const stadium = A.theme==='stadium';
  const kinds = A.theme==='desert' ? ['cactus','rockS','cactus'] : ['tree','lamp','tree'];

  if (stadium){
    // трибуны — ровным кольцом за беговой дорожкой, без разнобоя
    const ring = 245, step = 108, Q = Math.PI/2;
    for (let x=step/2; x<A.w; x+=step){ put(x, -ring, 'stand', 0); put(x, A.h+ring, 'stand', 0); }
    for (let y=step/2; y<A.h; y+=step){ put(-ring, y, 'stand', Q); put(A.w+ring, y, 'stand', Q); }
  } else {
    // деревья, фонари, кактусы — вразнобой, живее чем по линейке
    const step = 140;
    for (let x=step/2; x<A.w; x+=step){
      for (const [sy, row] of [[-1,0],[-1,1],[1,0],[1,1]]){
        if (row===1 && R()<0.45) continue;               // второй ряд — не сплошной
        const off = 62 + row*115 + R()*34;
        put(x + (R()-.5)*70, sy<0 ? -off : A.h+off, kinds[(R()*kinds.length)|0]);
      }
    }
    for (let y=step/2; y<A.h; y+=step){
      for (const [sx, row] of [[-1,0],[-1,1],[1,0],[1,1]]){
        if (row===1 && R()<0.45) continue;
        const off = 62 + row*115 + R()*34;
        put(sx<0 ? -off : A.w+off, y + (R()-.5)*70, kinds[(R()*kinds.length)|0]);
      }
    }
  }
  return d;
}

/* Разметка и потёртости прямо на покрытии арены */
function drawMarks(D, A){
  for (const m of D.marks){
    ctx.save(); ctx.translate(m.x, m.y);
    if (m.t==='arrow'){
      ctx.rotate(m.rot); ctx.scale(m.s,m.s);
      ctx.fillStyle='rgba(255,255,255,.13)';
      ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(-6,-20); ctx.lineTo(-6,-8);
      ctx.lineTo(-30,-8); ctx.lineTo(-30,8); ctx.lineTo(-6,8); ctx.lineTo(-6,20);
      ctx.closePath(); ctx.fill();
    } else if (m.t==='oil'){
      ctx.fillStyle='rgba(0,0,0,.3)';
      ctx.beginPath(); ctx.ellipse(0,0,m.r,m.r*0.7,0,0,6.283); ctx.fill();
      ctx.fillStyle='rgba(60,80,120,.18)';
      ctx.beginPath(); ctx.ellipse(-m.r*.2,-m.r*.15,m.r*.45,m.r*.3,0,0,6.283); ctx.fill();
    } else if (m.t==='paint'){
      ctx.rotate(m.rot); ctx.globalAlpha=.16; ctx.fillStyle=m.c;
      ctx.fillRect(-m.w/2,-9,m.w,18);
      ctx.fillRect(-m.w/2+m.w*.2,-22,m.w*.35,12);
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawArena(A){
  const D = game.deco;

  // ---- за пределами арены: земля, а не пустота ----
  const pad = 460;
  ctx.fillStyle = A.out;
  ctx.fillRect(-pad, -pad, A.w+pad*2, A.h+pad*2);
  if (A.theme==='stadium'){                    // беговая дорожка вокруг поля
    ctx.strokeStyle='#a8503a'; ctx.lineWidth=120;
    ctx.strokeRect(-96,-96,A.w+192,A.h+192);
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=3;
    ctx.strokeRect(-40,-40,A.w+80,A.h+80);
    ctx.strokeRect(-152,-152,A.w+304,A.h+304);
  }

  // ---- покрытие арены ----
  ctx.fillStyle = A.floor; ctx.fillRect(0,0,A.w,A.h);
  if (A.theme==='stadium'){                    // газон в полоску
    ctx.fillStyle='rgba(255,255,255,.05)';
    for (let x=0; x<A.w; x+=96) ctx.fillRect(x,0,48,A.h);
  }
  // пятна и потёртости
  if (D) for (const p of D.patches){
    ctx.fillStyle = A.theme==='desert' ? `rgba(255,220,170,${p.a})`
                  : A.theme==='stadium' ? `rgba(20,60,30,${p.a})`
                  : `rgba(0,0,0,${p.a})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
  }
  // разметка
  ctx.strokeStyle = A.line; ctx.globalAlpha=.45; ctx.lineWidth = 2;
  ctx.beginPath();
  for(let x=0;x<=A.w;x+=150){ ctx.moveTo(x,0); ctx.lineTo(x,A.h); }
  for(let y=0;y<=A.h;y+=150){ ctx.moveTo(0,y); ctx.lineTo(A.w,y); }
  ctx.stroke(); ctx.globalAlpha=1;
  if (D) drawMarks(D, A);
  // круг в центре — как на стадионе
  ctx.strokeStyle=A.line; ctx.globalAlpha=.55; ctx.lineWidth=5;
  ctx.beginPath(); ctx.arc(A.w/2, A.h/2, Math.min(A.w,A.h)*0.22, 0, 6.283); ctx.stroke();
  ctx.globalAlpha=1;

  if (skid) ctx.drawImage(skid,0,0);

  // трасса — только в ГОНКЕ и ИСПЫТАНИЯХ
  if (game.modeType !== 'combat' && game.circuit) drawTrack(game.circuit);
}

/* Отбойник — стенка с высотой. Рисуется двумя частями: дальняя сторона
   до объектов, ближняя после, иначе машины «протыкают» ограждение. */
function drawBarrier(A, part){
  const T = S.НАКЛОН, HB = 20, t = 16, seg = 46;
  const stripe = (x1, x2, y, horiz)=>{
    const len = x2-x1, n = Math.ceil(len/seg);
    for (let i=0;i<n;i++){
      const a = x1 + i*seg, b = Math.min(a+seg, x2);
      ctx.fillStyle = i%2 ? '#e8433a' : '#f2f4f8';
      if (horiz){
        ctx.fillRect(a, y*T - HB, b-a, HB);              // вертикальная стенка
        ctx.fillStyle = i%2 ? '#b8322a' : '#c9ced8';
        ctx.fillRect(a, y*T - HB - 4, b-a, 4);           // верхняя кромка
      } else {
        ctx.fillRect(y, a*T - HB, t, HB + (b-a)*T);
      }
    }
  };
  if (part==='far'){
    stripe(0, A.w, 0, true);                             // верхний борт
    // боковые борта — узкие стенки вдоль всей арены
    ctx.fillStyle='#c9ced8'; ctx.fillRect(0, -HB, t, A.h*T + HB);
    ctx.fillRect(A.w-t, -HB, t, A.h*T + HB);
    ctx.fillStyle='rgba(232,67,58,.85)';
    for (let y=0; y<A.h; y+=seg*2){
      ctx.fillRect(0, y*T - HB, t, seg*T); ctx.fillRect(A.w-t, y*T - HB, t, seg*T);
    }
    ctx.strokeStyle=A.accent; ctx.globalAlpha=.4; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(t, 0); ctx.lineTo(A.w-t, 0); ctx.stroke();
    ctx.globalAlpha=1;
  } else {
    stripe(0, A.w, A.h, true);                           // нижний борт
  }
}

function drawProp(p, A){
  const T = S.НАКЛОН;
  const lift = { tree:34, cactus:34, lamp:30, rockS:12, stand:26 }[p.kind] || 20;
  ctx.save();
  ctx.translate(p.x, p.y*T);
  // общая тень на земле — сплющенная, как и всё покрытие
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(4, 3, 25*p.s, 25*p.s*T, 0, 0, 6.283); ctx.fill();
  if (p.rot) ctx.rotate(p.rot);
  ctx.scale(p.s,p.s);
  ctx.translate(0, -lift);
  if (p.kind==='tree'){
    ctx.fillStyle='#4a3622'; ctx.fillRect(-4, 18, 8, 20);   // ствол
    // крона из нескольких шапок — объёмнее плоского круга
    ctx.fillStyle='#256030'; ctx.beginPath(); ctx.arc(0,0,27,0,6.283); ctx.fill();
    ctx.fillStyle='#31793c'; ctx.beginPath(); ctx.arc(-9,-4,20,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(11,7,16,0,6.283); ctx.fill();
    ctx.fillStyle='#43994c'; ctx.beginPath(); ctx.arc(-11,-11,12,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.14)'; ctx.beginPath(); ctx.arc(-14,-14,6,0,6.283); ctx.fill();
  } else if (p.kind==='cactus'){
    const arm=(x,y,w,h,r)=>{ ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); };
    ctx.fillStyle='#3f7a44';
    arm(-8,-30,16,58,8); arm(-26,-14,20,13,6); arm(6,-4,20,13,6);
    arm(-26,-24,11,16,5); arm(15,-15,11,16,5);
    ctx.fillStyle='rgba(255,255,255,.13)'; arm(-6,-28,5,52,3);   // блик по стволу
  } else if (p.kind==='rockS'){
    ctx.fillStyle='#6b5340'; ctx.beginPath(); ctx.arc(0,0,22,0,6.283); ctx.fill();
    ctx.fillStyle='#7d6350'; ctx.beginPath(); ctx.arc(-6,-6,13,0,6.283); ctx.fill();
  } else if (p.kind==='lamp'){
    ctx.fillStyle='#3a4258'; ctx.fillRect(-4,-8,8,26);
    const g=ctx.createRadialGradient(0,-14,2,0,-14,48);
    g.addColorStop(0,'rgba(255,235,170,.5)'); g.addColorStop(1,'rgba(255,220,140,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-14,48,0,6.283); ctx.fill();
    ctx.fillStyle='#ffe9a8'; ctx.beginPath(); ctx.arc(0,-14,9,0,6.283); ctx.fill();
  } else if (p.kind==='stand'){
    ctx.fillStyle='#2a3145'; ctx.fillRect(-46,-26,92,52);
    ctx.fillStyle='#333c54'; ctx.fillRect(-46,-26,92,13);
    if (p.crowd) for (const c of p.crowd){
      ctx.fillStyle=c.c; ctx.beginPath(); ctx.arc(c.dx*0.62,c.dy*0.62,3.4,0,6.283); ctx.fill();
    }
    ctx.strokeStyle='#1b2130'; ctx.lineWidth=3; ctx.strokeRect(-46,-26,92,52);
  }
  ctx.restore();
}
function drawTrack(circuit){
  ctx.save();
  ctx.strokeStyle='rgba(255,210,60,.55)'; ctx.lineWidth=6; ctx.setLineDash([26,18]);
  ctx.beginPath();
  circuit.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  if (game.modeType==='race') ctx.closePath();
  ctx.stroke(); ctx.setLineDash([]);
  circuit.forEach((p,i)=>{
    const isFinish = i===0;
    ctx.beginPath(); ctx.arc(p[0],p[1], S.РАДИУС_ЧЕКПОИНТА, 0, 6.283);
    ctx.strokeStyle = isFinish ? '#49d16b' : 'rgba(120,200,255,.75)';
    ctx.lineWidth = isFinish ? 6 : 4;
    ctx.stroke();
    ctx.fillStyle = isFinish ? 'rgba(73,209,107,.14)' : 'rgba(120,200,255,.08)';
    ctx.fill();
  });
  ctx.restore();
}
/* Препятствие в изометрии: тень на земле, боковина нужной высоты, крышка сверху */
function drawObs(o){
  const [x,y,r,t] = o;
  const T = S.НАКЛОН;
  const hgt = t==='crate' ? r*1.15 : t==='barrel' ? r*1.5 : t==='rock' ? r*0.75
            : t==='cone' ? r*1.4 : r*0.5;
  const bx = x, by = y*T;

  // мягкая тень
  softShadow(bx, by+2, r*0.9, r*0.5, 0, 0.38);

  // боковина с подсветкой слева: цилиндр получает круглый градиент,
  // контейнер — линейный, поэтому оба читаются объёмными
  const baseCol = t==='crate' ? (o[4]||'#a5763d')
                : t==='barrel' ? '#d93b30' : t==='tire' ? '#2b2e38'
                : t==='cone' ? '#ff6a1a' : '#6b5340';
  if (t==='crate'){
    const g = ctx.createLinearGradient(bx-r, 0, bx+r, 0);
    g.addColorStop(0,   shade(baseCol, 0.78));
    g.addColorStop(0.4, shade(baseCol, 0.58));
    g.addColorStop(1,   shade(baseCol, 0.34));
    ctx.fillStyle = g;
    ctx.fillRect(bx-r, by-hgt, r*2, hgt + r*T);
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(bx-r, by-hgt+(hgt+r*T)*0.78, r*2, (hgt+r*T)*0.22);
  } else {
    const g = ctx.createLinearGradient(bx-r, 0, bx+r, 0);
    g.addColorStop(0,    shade(baseCol, 0.85));
    g.addColorStop(0.28, shade(baseCol, 0.62));
    g.addColorStop(0.72, shade(baseCol, 0.42));
    g.addColorStop(1,    shade(baseCol, 0.3));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(bx, by, r, r*T, 0, 0, Math.PI);          // низ цилиндра
    ctx.lineTo(bx-r, by-hgt); ctx.lineTo(bx+r, by-hgt);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(bx-r, by-hgt, r*2, hgt);
    // вертикальный блик — только на высоких гладких объектах (бочка, конус)
    if (t==='barrel' || t==='cone'){
      ctx.fillStyle = 'rgba(255,255,255,.13)';
      ctx.fillRect(bx-r*0.62, by-hgt, r*0.2, hgt);
    }
  }

  // крышка — прежний рисунок, но приподнятый и сжатый по вертикали
  ctx.save(); ctx.translate(bx, by-hgt); ctx.scale(1, T);
  drawObsTop(o, r, t);
  ctx.restore();
}

function drawObsTop(o, r, t){
  ctx.save();
  if (t==='tire'){
    // связка покрышек с цветной окантовкой — как на настоящих трассах
    ctx.fillStyle='#2b2e38'; ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.fill();
    ctx.strokeStyle='#ffc93c'; ctx.lineWidth=r*.2;
    ctx.beginPath(); ctx.arc(0,0,r*.88,0,6.283); ctx.stroke();
    ctx.fillStyle='#3a3e4b'; ctx.beginPath(); ctx.arc(0,0,r*.66,0,6.283); ctx.fill();
    ctx.fillStyle='#1a1c24'; ctx.beginPath(); ctx.arc(0,0,r*.4,0,6.283); ctx.fill();
    ctx.strokeStyle='#4a4f5e'; ctx.lineWidth=3;
    for(let i=0;i<8;i++){ const a=i/8*6.283; ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*.45,Math.sin(a)*r*.45); ctx.lineTo(Math.cos(a)*r*.64,Math.sin(a)*r*.64); ctx.stroke(); }
  } else if (t==='crate'){
    // грузовой контейнер: цвет берётся из арены (5-й элемент), иначе деревянный ящик
    const base = o[4] || '#a5763d';
    ctx.fillStyle=base; ctx.fillRect(-r,-r,r*2,r*2);
    ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(-r,-r,r*2,r*0.5);
    ctx.fillStyle='rgba(0,0,0,.22)';
    for(let i=-r+7;i<r;i+=11) ctx.fillRect(i,-r,4,r*2);      // рёбра контейнера
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=4; ctx.strokeRect(-r,-r,r*2,r*2);
  } else if (t==='cone'){
    // дорожный конус: оранжевый с белой полосой
    ctx.fillStyle='#ff6a1a'; ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,r*.62,0,6.283); ctx.fill();
    ctx.fillStyle='#ff8c3a'; ctx.beginPath(); ctx.arc(0,0,r*.34,0,6.283); ctx.fill();
  } else if (t==='barrel'){
    // бочка: красно-белая, как на автодроме
    ctx.fillStyle='#d93b30'; ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.fill();
    ctx.strokeStyle='#f2f4f8'; ctx.lineWidth=r*.28;
    ctx.beginPath(); ctx.arc(0,0,r*.72,0,6.283); ctx.stroke();
    ctx.fillStyle='#8f241c'; ctx.beginPath(); ctx.arc(0,0,r*.3,0,6.283); ctx.fill();
  } else {
    // форма камня считается один раз и запоминается, иначе он дрожал бы каждый кадр
    if (!o.shape){ o.shape=[]; for(let i=0;i<7;i++) o.shape.push(rnd(.86,1.02)); }
    ctx.fillStyle='#4d4237'; ctx.beginPath();
    for(let i=0;i<7;i++){ const a=i/7*6.283, rr=r*o.shape[i];
      i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#5e5244'; ctx.beginPath(); ctx.arc(-r*.2,-r*.25,r*.42,0,6.283); ctx.fill();
  }
  ctx.restore();
}

/* Затемняет цвет — для боковых граней кузова */
function shade(hex, k){
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(Math.min(255,((n>>16)&255)*k)),
        g = Math.round(Math.min(255,((n>>8)&255)*k)),
        b = Math.round(Math.min(255,(n&255)*k));
  return `rgb(${r},${g},${b})`;
}
/* Тот же цвет, но с прозрачностью — для бликов и подсветки */
function tint(hex, k, a){
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(Math.min(255,((n>>16)&255)*k)),
        g = Math.round(Math.min(255,((n>>8)&255)*k)),
        b = Math.round(Math.min(255,(n&255)*k));
  return `rgba(${r},${g},${b},${a})`;
}

/* Единый источник света сцены: сверху-слева. Всё освещается согласованно,
   поэтому картинка читается объёмной, а не набором плоских пятен. */
const LIGHT = { x:-0.55, y:-0.83 };

/* Мягкая тень: несколько эллипсов с падающей прозрачностью вместо одного пятна */
function softShadow(x, y, rx, ry, rot, strength){
  const T = S.НАКЛОН;
  const ox = -LIGHT.x*10, oy = -LIGHT.y*10*T;
  for (let i=3; i>=1; i--){
    ctx.fillStyle = `rgba(0,0,0,${(strength||0.4) * (i===1?0.5:0.18)})`;
    ctx.save();
    ctx.transform(Math.cos(rot||0), Math.sin(rot||0)*T, -Math.sin(rot||0), Math.cos(rot||0)*T,
                  x+ox*0.5, y+oy*0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, rx*(1+i*0.10), ry*(1+i*0.10), 0, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}

/* Машина в изометрии: плоское основание выдавливается вверх на ВЫСОТА_МАШИНЫ,
   боковые грани дают объём, а крыша несёт «скин» — полосы, номер, стекло. */
function drawCar(c){
  const T = S.НАКЛОН, HGT = S.ВЫСОТА_МАШИНЫ, dead = c.dead>0;
  const L = c.l, Wd = c.w, ang = c.a + c.wob;
  const cos = Math.cos(ang), sin = Math.sin(ang);
  const def = c.def, col = c.color;
  const bx = c.x, by = c.y*T;                       // точка на земле в проекции

  if (dead) ctx.globalAlpha = 0.3 + 0.25*Math.sin(performance.now()/90);

  // ---- мягкая тень на земле ----
  softShadow(bx, by+3, L*0.5, Wd*0.5, ang, 0.45);

  // ---- лучи фар: ночью светят заметно, днём почти нет ----
  if (S.ФАРЫ_СВЕТЯТ && !dead){
    const night = nightAmount();
    if (night > 0.05){
      const len = 210, spread = 0.34;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const s of [-1, 1]){
        const ox = bx + (cos*L*0.42 - s*Wd*0.3*sin);
        const oy = by + (sin*L*0.42 + s*Wd*0.3*cos)*T - HGT*0.5;
        const g = ctx.createRadialGradient(ox, oy, 4, ox, oy, len);
        g.addColorStop(0, `rgba(255,244,205,${0.5*night})`);
        g.addColorStop(0.45,`rgba(255,236,170,${0.18*night})`);
        g.addColorStop(1, 'rgba(255,230,150,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(ox, oy);
        ctx.arc(ox, oy, len, ang - spread, ang + spread);
        ctx.closePath();
        ctx.save(); ctx.translate(ox, oy); ctx.scale(1, T); ctx.translate(-ox, -oy);
        ctx.fill(); ctx.restore();
      }
      ctx.restore();
    }
  }

  // ---- свечение турбо позади машины ----
  if (c.boosting && !dead){
    const ex = bx - cos*L*0.6, ey = by - sin*L*0.6*T - HGT*0.4;
    const g = ctx.createRadialGradient(ex,ey,2,ex,ey,34);
    g.addColorStop(0,'rgba(255,200,90,.85)'); g.addColorStop(1,'rgba(255,110,20,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,ey,34,0,6.283); ctx.fill();
  }

  // ---- колёса с дисками ----
  for (const sx of [-1,1]) for (const sy of [-1,1]){
    const lx = sx*L*0.29, ly = sy*(Wd*0.52);
    ctx.save();
    ctx.transform(cos, sin*T, -sin, cos*T, bx + lx*cos - ly*sin, by + (lx*sin + ly*cos)*T);
    ctx.fillStyle='#0a0c11';                                  // резина
    rr(-L*0.105, -Wd*0.115, L*0.21, Wd*0.23, 4); ctx.fill();
    ctx.fillStyle='#2a2f3b';                                  // диск
    rr(-L*0.062, -Wd*0.07, L*0.124, Wd*0.14, 3); ctx.fill();
    ctx.fillStyle='rgba(200,215,235,.55)';                    // блик на диске
    rr(-L*0.05, -Wd*0.055, L*0.10, Wd*0.045, 2); ctx.fill();
    ctx.restore();
  }

  // затемнение под кузовом — машина «прилипает» к земле, а не парит над ней
  ctx.save();
  ctx.transform(cos, sin*T, -sin, cos*T, bx, by);
  ctx.fillStyle='rgba(0,0,0,.32)'; carBodyPath(L*1.03, Wd*1.08); ctx.fill();
  ctx.restore();

  // ---- объём кузова: силуэт выдавливается снизу вверх с шагом в 1px,
  //      яркость слоя зависит от высоты — получается плавный скат, а не ступеньки
  for (let d = HGT; d >= 0; d--){
    const t = 1 - d/HGT;
    ctx.save();
    ctx.transform(cos, sin*T, -sin, cos*T, bx, by - d);
    ctx.fillStyle = shade(col, 0.34 + t*t*0.42);
    carBodyPath(L, Wd); ctx.fill();
    ctx.restore();
  }

  // ---- крыша и скин: рисуем в системе координат машины ----
  ctx.save();
  ctx.transform(cos, sin*T, -sin, cos*T, bx, by - HGT);
  drawCarSkin(c, def, col, L, Wd, dead);
  ctx.restore();

  ctx.globalAlpha = 1;

  // ---- маркер игрока / здоровье бота ----
  if (c.pi>=0 && !dead){
    ctx.save(); ctx.translate(bx, by - HGT - 30);
    const pc = c.pi===0 ? '#5fd0ff' : '#ff8a5c';
    ctx.globalAlpha=.3; ctx.fillStyle=pc;
    ctx.beginPath(); ctx.ellipse(0, HGT+30, 20, 20*T, 0, 0, 6.283); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle=pc;
    ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(-8,-2); ctx.lineTo(8,-2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if (c.pi<0 && !dead){
    const p = c.hp/c.maxHp, y = by - HGT - 16;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(bx-19, y, 38, 5);
    ctx.fillStyle = p>.5?'#49d16b':p>.25?'#ffc93c':'#e8433a';
    ctx.fillRect(bx-18, y+1, 36*p, 3);
  }
}

/* Силуэт кузова: сужается к носу и корме, как настоящая машина. Нос по +X. */
function carBodyPath(L, Wd){
  const h = Wd/2, F = L/2;
  ctx.beginPath();
  ctx.moveTo(-F*0.80, -h*0.74);
  ctx.quadraticCurveTo(-F*1.0, -h*0.62, -F*0.98, -h*0.24);     // узкая корма
  ctx.lineTo(-F*0.98, h*0.24);
  ctx.quadraticCurveTo(-F*1.0, h*0.62, -F*0.80, h*0.74);
  ctx.quadraticCurveTo(-F*0.62, h*0.99, -F*0.40, h*0.99);      // плечи задних крыльев
  ctx.lineTo(F*0.05, h*0.96);
  ctx.quadraticCurveTo(F*0.62, h*0.80, F*0.97, h*0.26);        // длинный покатый нос
  ctx.quadraticCurveTo(F*1.02, 0, F*0.97, -h*0.26);
  ctx.quadraticCurveTo(F*0.62, -h*0.80, F*0.05, -h*0.96);
  ctx.lineTo(-F*0.40, -h*0.99);
  ctx.quadraticCurveTo(-F*0.62, -h*0.99, -F*0.80, -h*0.74);
  ctx.closePath();
}

/* Крыша машины — здесь живёт весь «скин». Координаты локальные: нос по +X. */
function drawCarSkin(c, def, col, L, Wd, dead){
  const skin = def.skin || 'muscle', dark = def.dark || '#222';
  const h = Wd/2;

  // ---- краска металлик: свет сверху-слева, тень справа-снизу ----
  const paint = ctx.createLinearGradient(-L*0.1, -h*1.1, L*0.1, h*1.1);
  paint.addColorStop(0,    shade(col, 1.28));      // засветка со стороны источника
  paint.addColorStop(0.34, shade(col, 1.05));
  paint.addColorStop(0.62, shade(col, 0.82));
  paint.addColorStop(1,    shade(col, 0.55));      // затенённый борт
  ctx.fillStyle = paint; carBodyPath(L, Wd); ctx.fill();

  ctx.save(); carBodyPath(L, Wd); ctx.clip();

  // тёмный обвес по нижней кромке — машина смотрится приземистой
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.fillRect(-L/2,  h-Wd*0.14, L, Wd*0.14);
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.fillRect(-L/2, -h, L, Wd*0.1);

  // острый блик вдоль кузова — главный признак лакированного металла
  const spec = ctx.createLinearGradient(0, -h*0.72, 0, -h*0.2);
  spec.addColorStop(0,'rgba(255,255,255,0)');
  spec.addColorStop(0.5,'rgba(255,255,255,.55)');
  spec.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = spec;
  ctx.fillRect(-L*0.42, -h*0.72, L*0.84, h*0.52);

  // рёбра жёсткости на капоте
  ctx.strokeStyle='rgba(0,0,0,.16)'; ctx.lineWidth=1.5;
  for (const s of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(L*0.44, s*h*0.30); ctx.lineTo(L*0.06, s*h*0.44); ctx.stroke();
  }
  ctx.restore();

  // ---- индивидуальный рисунок (обрезан по силуэту, чтобы не торчал за кузов) ----
  ctx.save(); carBodyPath(L, Wd); ctx.clip();
  if (skin==='muscle'){
    ctx.fillStyle = dark; rr(L*0.06, -h+3, L*0.34, Wd-6, 4); ctx.fill();   // чёрный капот
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillRect(-L/2+4, -7, L-8, 5); ctx.fillRect(-L/2+4, 2, L-8, 5);     // двойная полоса
  } else if (skin==='offroad'){
    ctx.fillStyle = dark; rr(-L*0.36, -h+2, L*0.3, Wd-4, 3); ctx.fill();   // багажник
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
    for(let i=-2;i<=2;i++){ ctx.beginPath();
      ctx.moveTo(-L*0.36, i*4); ctx.lineTo(-L*0.36+L*0.3, i*4); ctx.stroke(); }
    ctx.fillStyle='#c9ced8';                                               // кенгурятник
    rr(L*0.40, -h*0.66, L*0.05, Wd*0.66, 2); ctx.fill();
    ctx.fillStyle='#ffd23f';                                               // люстра фар
    rr(L*0.16, -h*0.8, L*0.06, Wd*0.16, 1); ctx.fill();
    rr(L*0.16,  h*0.64, L*0.06, Wd*0.16, 1); ctx.fill();
  } else if (skin==='sport'){
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.fillRect(-L/2+3, -5.5, L-6, 3); ctx.fillRect(-L/2+3, 2.5, L-6, 3);
    ctx.fillStyle = dark; rr(L*0.1,-h+4, L*0.2, Wd-8, 3); ctx.fill();      // воздухозаборник
  } else if (skin==='race'){
    ctx.fillStyle = dark; rr(-L/2+3,-h+3, L-6, Wd-6, 5); ctx.fill();
    ctx.fillStyle = col;  rr(-L/2+6,-h+6, L-12, Wd-12, 4); ctx.fill();
    // шашечки по бортам
    for (let i=0;i<7;i++){ ctx.fillStyle = i%2?'#fff':'#15171d';
      ctx.fillRect(-L/2+6+i*((L-12)/7), -h+2, (L-12)/7, 4);
      ctx.fillRect(-L/2+6+i*((L-12)/7),  h-6, (L-12)/7, 4); }
  } else if (skin==='stealth'){
    ctx.fillStyle = dark; rr(-L/2+2,-h+2, L-4, Wd-4, 6); ctx.fill();
    ctx.strokeStyle='#c04dff'; ctx.lineWidth=2; ctx.globalAlpha=.9;        // неон
    rr(-L/2+4,-h+4, L-8, Wd-8, 5); ctx.stroke(); ctx.globalAlpha=1;
  } else if (skin==='flame'){
    ctx.fillStyle='#ffd23f';                                               // языки пламени
    for (const s of [-1,1]){
      ctx.beginPath(); ctx.moveTo(L*0.46, s*(h-3));
      ctx.lineTo(L*0.05, s*(h-1)); ctx.lineTo(-L*0.1, s*(h-6));
      ctx.lineTo(L*0.1, s*(h-5)); ctx.lineTo(-L*0.3, s*(h-8));
      ctx.lineTo(L*0.3, s*(h-7)); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='#ff5a1a';
    for (const s of [-1,1]){
      ctx.beginPath(); ctx.moveTo(L*0.44, s*(h-5));
      ctx.lineTo(L*0.0, s*(h-4)); ctx.lineTo(-L*0.14, s*(h-8));
      ctx.lineTo(L*0.16, s*(h-7)); ctx.closePath(); ctx.fill();
    }
  }

  ctx.restore();   // конец обрезки по силуэту

  // ---- остекление: лобовое, заднее и крыша ----
  // лобовое — трапецией, сужается к носу, как на настоящей машине
  ctx.beginPath();
  ctx.moveTo(L*0.24, -h*0.50); ctx.lineTo(L*0.24, h*0.50);
  ctx.lineTo(L*0.02, h*0.66);  ctx.lineTo(L*0.02, -h*0.66);
  ctx.closePath();
  const glass = ctx.createLinearGradient(L*0.02, -h*0.6, L*0.26, h*0.5);
  glass.addColorStop(0,'rgba(186,224,255,.85)');    // отражение неба
  glass.addColorStop(0.45,'rgba(70,105,155,.92)');
  glass.addColorStop(1,'rgba(24,38,64,.96)');
  ctx.fillStyle = glass; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1.4; ctx.stroke();

  // крыша между стёклами
  ctx.fillStyle = shade(col, 0.92);
  rr(-L*0.20, -h*0.62, L*0.40, Wd*0.62, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  rr(-L*0.20, -h*0.62, L*0.40, Wd*0.2, 3); ctx.fill();

  // заднее стекло
  ctx.beginPath();
  ctx.moveTo(-L*0.22, -h*0.60); ctx.lineTo(-L*0.22, h*0.60);
  ctx.lineTo(-L*0.38, h*0.44);  ctx.lineTo(-L*0.38, -h*0.44);
  ctx.closePath();
  ctx.fillStyle = 'rgba(30,46,74,.94)'; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.stroke();

  // зеркала заднего вида
  ctx.fillStyle = shade(col, 0.7);
  for (const s of [-1,1]){
    rr(L*0.20, s*h*0.86 - (s>0?0:Wd*0.09), L*0.07, Wd*0.09, 2); ctx.fill();
  }

  // решётка радиатора и воздухозаборник в носу
  ctx.fillStyle='rgba(10,12,18,.85)';
  rr(L*0.40, -h*0.34, L*0.06, Wd*0.68, 2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.08)';
  for (let i=0;i<3;i++) ctx.fillRect(L*0.405, -h*0.3 + i*Wd*0.22, L*0.05, 1.6);

  // задний диффузор
  ctx.fillStyle='rgba(10,12,18,.6)';
  rr(-L*0.49, -h*0.4, L*0.05, Wd*0.8, 2); ctx.fill();

  // ---- антикрыло: вписано в корму, не торчит за силуэт ----
  if (def.spoiler){
    ctx.fillStyle = dark;
    rr(-L*0.47, -h*0.82, L*0.07, Wd*0.82, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    rr(-L*0.47, -h*0.82, L*0.07, Wd*0.2, 2); ctx.fill();
  }

  // ---- номер ----
  if (def.num){
    ctx.save(); ctx.rotate(Math.PI/2);
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='bold 11px Trebuchet MS, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(def.num, 0, L*0.34);
    ctx.restore();
  }

  // ---- фары и стопы: посажены внутрь силуэта, иначе торчат по углам ----
  if (!dead){
    ctx.fillStyle='#eef7ff';
    rr(L*0.40, -h*0.62, L*0.05, Wd*0.2, 2); ctx.fill();
    rr(L*0.40,  h*0.42, L*0.05, Wd*0.2, 2); ctx.fill();
    ctx.fillStyle='rgba(255,70,60,.95)';
    rr(-L*0.45, -h*0.52, L*0.035, Wd*0.18, 1); ctx.fill();
    rr(-L*0.45,  h*0.34, L*0.035, Wd*0.18, 1); ctx.fill();
  }
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawParts(){
  const T = S.НАКЛОН;
  for(const p of parts){
    ctx.globalAlpha = clamp(p.life,0,1) * (p.g?0.42:1);
    ctx.fillStyle = 'rgba('+p.col+',1)';
    // частицы висят чуть выше земли — иначе кажется, что они лежат под машиной
    ctx.beginPath(); ctx.arc(p.x, p.y*T - 12, p.r*(p.g?1:p.life), 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* 0 = день, 1 = глубокая ночь. Плавный цикл по времени матча. */
function nightAmount(){
  const t = (game.frame/60) / S.СЕКУНД_В_СУТКАХ;
  return clamp((1 - Math.cos(t * Math.PI * 2)) / 2, 0, 1);
}

/* Ночь: затемняем кадр и подкрашиваем его в синеву */
function drawNight(){
  const n = nightAmount(); if (n < 0.02) return;
  ctx.save();
  ctx.fillStyle = `rgba(8,14,38,${n*S.НОЧЬ_ТЕМНОТА})`;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawVignette(){
  const g = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42, W/2,H/2,Math.max(W,H)*0.82);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawTouchUI(){
  if (!('ontouchstart' in window)) return;
  ctx.save(); ctx.globalAlpha=.16;
  const sides = game.players===2 ? [0,1] : [0];
  for (const s of sides){
    const bx = s===0 ? W*0.09 : W*0.91;
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(bx, H*0.72, 52, 0, 6.283); ctx.stroke();
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(bx, H*0.88, 32, 0, 6.283); ctx.fill();
    ctx.globalAlpha=.5; ctx.fillStyle='#000'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('ТУРБО', bx, H*0.88+5); ctx.globalAlpha=.16;
  }
  ctx.restore();
}

/* ---------------- ИГРА ---------------- */
const game = {
  state:'menu', mode:'crash', modeType:'combat', players:1, arenaIdx:0,
  arena:null, deco:null, circuit:null, cars:[], time:0, frame:0
};

function startMatch(){
  const A = ARENAS[game.arenaIdx];
  const modeDef = MODES.find(m=>m.id===game.mode);
  game.modeType = modeDef.type;
  game.circuit = modeDef.type==='combat' ? null : CIRCUITS[A.id];
  game.arena = A; game.cars = []; parts.length=0; initSkid(A);
  game.deco = buildDeco(A);
  const def = CARS.find(c=>c.id===save.car) || CARS[0];

  // старт: в бою — центр арены, в гонке/испытаниях — у первого чекпоинта (финишной линии)
  const startX = game.circuit ? game.circuit[0][0] : A.w*0.5;
  const startY = game.circuit ? game.circuit[0][1] : A.h*0.72;
  const startA = game.circuit ? Math.atan2(game.circuit[1][1]-game.circuit[0][1], game.circuit[1][0]-game.circuit[0][0]) : -1.57;

  for (let i=0;i<game.players;i++){
    const c = new Car({ x:startX + (i?46:-46)*Math.cos(startA+1.57), y:startY + (i?46:-46)*Math.sin(startA+1.57),
      a:startA, def, up:save.up, pi:i, color: save.color || def.color, name:'P'+(i+1) });
    game.cars.push(c);
  }
  for (let i=0;i<S.БОТОВ_В_БОЮ;i++){
    const bd = CARS[Math.min(CARS.length-1, 1 + (i % 3))];
    const brain = BRAINS[i % BRAINS.length];
    let bx, by, ba;
    if (game.circuit){ bx=startX+(i+2)*40*Math.cos(startA+1.57); by=startY+(i+2)*40*Math.sin(startA+1.57); ba=startA; }
    else { const ang=(i/S.БОТОВ_В_БОЮ)*6.283; bx=A.w/2+Math.cos(ang)*A.w*0.3; by=A.h/2+Math.sin(ang)*A.h*0.28; ba=ang+3.14; }
    game.cars.push(new Car({ x:bx, y:by, a:ba, def:bd, bot:true, brain, name:brain.name }));
  }
  // машины стартуют уже возле circuit[0] — считаем его пройденным сразу
  if (game.circuit) for (const c of game.cars) c.cp = 1;
  cam.x = startX; cam.y = startY; cam.z = 0.8;
  const timeS = game.modeType==='combat' ? S.ВРЕМЯ_БОЯ : game.modeType==='race' ? S.ВРЕМЯ_ГОНКИ : S.ВРЕМЯ_ИСПЫТАНИЯ;
  game.time = timeS * 60; game.frame = 0;
  game.state = 'play';
  UI.show(null); document.getElementById('hud').classList.add('on');
  document.getElementById('pP2').style.display = game.players===2 ? '' : 'none';
  document.getElementById('hint').textContent =
    ('ontouchstart' in window) ? 'Веди пальцем — машина едет за пальцем'
    : (game.players===2 ? 'P1: WASD + Shift  ·  P2: стрелки + правый Shift'
                        : 'WASD или стрелки  ·  Пробел — турбо');
  audio();
}

function tick(){
  game.frame++;
  const world = game;
  for (const c of world.cars){
    if (c.dead>0){ c.dead--; if (c.dead<=0) c.respawn(world.arena); continue; }
    if (c.finished){ c.sp*=0.9; c.vx*=0.9; c.vy*=0.9; continue; }
    const inp = c.pi>=0 ? (()=>{ const i=readInput(c.pi);
        return { dir:i.dir, dx:i.dx, dy:i.dy, up:i.up, down:i.down, turn:i.turn,
                 turbo:i.turbo, brake:!!i.down, boost:1 }; })()
      : botThink(c, world);
    c.drive(inp);
  }
  collide(world);
  if (game.modeType !== 'combat') raceProgress(world);
  updParts();
  updCam();

  const p1 = world.cars.find(c=>c.pi===0);
  engine(p1 ? Math.abs(p1.sp) : 0, p1 && p1.boosting, p1 ? (p1.slip||0)-0.5 : 0);

  game.time--;
  if (game.modeType==='combat'){
    if (game.time <= 0) finish();
  } else {
    const humans = world.cars.filter(c=>c.pi>=0);
    if (humans.every(h=>h.finished) || game.time<=0) finish();
  }
}

function finish(){
  if (game.modeType==='combat') return finishCombat();
  if (game.modeType==='race')   return finishRace();
  return finishTrial();
}

function payout(html, earned){
  save.coins += earned; persist(); sfx('coin');
  html += `<div class="line"><span>Получено монет</span><b>🪙 ${earned}</b></div>`;
  html += `<div class="line"><span>Всего монет</span><b>🪙 ${save.coins}</b></div>`;
  document.getElementById('resBody').innerHTML = html;
  game.state='result'; document.getElementById('hud').classList.remove('on');
  UI.show('scResult');
}

function finishCombat(){
  const humans = game.cars.filter(c=>c.pi>=0);
  const all = [...game.cars].sort((a,b)=>b.score-a.score);
  const winner = all[0];
  let earned = 0;
  for (const h of humans) earned += Math.round(h.score * S.МОНЕТ_ЗА_100_ОЧКОВ/100);
  earned += S.МОНЕТ_УТЕШИТЕЛЬНЫХ;
  if (winner && winner.pi>=0) earned += S.МОНЕТ_ЗА_ПОБЕДУ;
  const bestNow = Math.max(...humans.map(h=>h.score));
  if (bestNow > save.best) save.best = bestNow;

  let html='';
  for (const h of humans) html += `<div class="line"><span>${h.name} — очки</span><b>${h.score}</b></div>`;
  html += `<div class="line"><span>Победитель</span><b>${winner? (winner.pi>=0?winner.name:'БОТ '+winner.name) : '—'}</b></div>`;
  html += `<div class="line"><span>Рекорд</span><b>${save.best}</b></div>`;
  payout(html, earned);
}

/* Место в гонке: раньше финишировал — выше место; не финишировал — по числу кругов/чекпоинтов */
function ranked(){
  return [...game.cars].sort((a,b)=>{
    if (a.finished && b.finished) return a.finishFrame-b.finishFrame;
    if (a.finished) return -1; if (b.finished) return 1;
    if (a.lap!==b.lap) return b.lap-a.lap;
    return b.cp-a.cp;
  });
}
const PLACE_COINS = [120, 80, 50, 25];

function finishRace(){
  const order = ranked();
  const humans = game.cars.filter(c=>c.pi>=0);
  let earned = S.МОНЕТ_УТЕШИТЕЛЬНЫХ;
  let html='';
  humans.forEach(h=>{
    const place = order.indexOf(h)+1;
    earned += PLACE_COINS[place-1] || 15;
    html += `<div class="line"><span>${h.name} — место</span><b>${place} из ${order.length}</b></div>`;
  });
  const winner = order[0];
  html += `<div class="line"><span>Победитель</span><b>${winner.pi>=0?winner.name:'БОТ '+winner.name}</b></div>`;
  payout(html, earned);
}

function finishTrial(){
  const humans = game.cars.filter(c=>c.pi>=0);
  let earned = S.МОНЕТ_УТЕШИТЕЛЬНЫХ, html='';
  for (const h of humans){
    if (h.finished){
      const sec = (h.finishFrame/60).toFixed(1);
      const sc = Math.max(20, Math.round(420 - h.finishFrame/60*4));
      earned += Math.round(sc * S.МОНЕТ_ЗА_100_ОЧКОВ/100) + 30;
      html += `<div class="line"><span>${h.name} — время</span><b>${sec} сек</b></div>`;
    } else {
      html += `<div class="line"><span>${h.name}</span><b>не финишировал</b></div>`;
    }
  }
  payout(html, earned);
}

function render(){
  ctx.fillStyle='#0b0d12'; ctx.fillRect(0,0,W,H);
  if (game.arena){
    const A = game.arena, T = S.НАКЛОН;
    ctx.save();
    const sx = cam.sh ? rnd(-cam.sh,cam.sh) : 0, sy = cam.sh ? rnd(-cam.sh,cam.sh) : 0;
    // камера ниже центра — впереди больше дороги, как в гоночных играх
    ctx.translate(W/2+sx, H/2+sy); ctx.scale(cam.z,cam.z);
    ctx.translate(-cam.x, -cam.y*T);

    // 1) земля — рисуется в мировых координатах, сплющенных по вертикали
    ctx.save(); ctx.scale(1, T); drawArena(A); ctx.restore();

    // 2) дальний борт ограждения
    drawBarrier(A, 'far');

    // 3) всё объёмное — от дальнего к ближнему, чтобы перекрытия были верными
    const objs = [];
    if (game.deco) for (const p of game.deco.props) objs.push({ y:p.y, f:()=>drawProp(p, A) });
    for (const o of A.obs) objs.push({ y:o[1], f:()=>drawObs(o) });
    for (const c of game.cars) objs.push({ y:c.y, f:()=>drawCar(c) });
    objs.sort((a,b)=>a.y-b.y);
    for (const it of objs) it.f();

    // 4) ближний борт — поверх машин
    drawBarrier(A, 'near');

    drawParts();
    ctx.restore();
  }
  drawNight();
  drawVignette();
  if (game.state==='play'){ drawTouchUI(); drawSpeedo(); }
}

/* Спидометр в правом нижнем углу: дуга с цветными зонами, стрелка, цифры */
function drawSpeedo(){
  const p1 = game.cars.find(c=>c.pi===0); if (!p1) return;
  const R = Math.min(96, Math.min(W,H)*0.16);
  const cx = W - R - 26, cy = H - R*0.55 - 26;
  const A0 = Math.PI*0.82, A1 = Math.PI*2.18;          // начало и конец шкалы
  const maxKmh = 220;
  const kmh = Math.min(maxKmh, Math.abs(p1.sp) * 26);

  ctx.save();
  // подложка
  ctx.fillStyle='rgba(8,11,18,.72)';
  ctx.beginPath(); ctx.arc(cx, cy, R*1.06, A0-0.12, A1+0.12); ctx.lineTo(cx,cy); ctx.fill();

  // цветные зоны шкалы: зелёная → жёлтая → красная
  const zones = [[0,.45,'#3fbf5a'], [.45,.75,'#ffc93c'], [.75,1,'#e8433a']];
  for (const [a,b,col] of zones){
    ctx.strokeStyle=col; ctx.lineWidth=R*0.17; ctx.lineCap='butt';
    ctx.beginPath(); ctx.arc(cx, cy, R*0.82, A0+(A1-A0)*a, A0+(A1-A0)*b); ctx.stroke();
  }
  // деления
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2;
  for (let i=0;i<=11;i++){
    const a = A0 + (A1-A0)*(i/11), big = i%2===0;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*R*0.66, cy+Math.sin(a)*R*0.66);
    ctx.lineTo(cx+Math.cos(a)*R*(big?0.5:0.58), cy+Math.sin(a)*R*(big?0.5:0.58));
    ctx.stroke();
  }
  // стрелка
  const ang = A0 + (A1-A0)*clamp(kmh/maxKmh,0,1);
  ctx.strokeStyle='#ff5a4a'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx-Math.cos(ang)*R*0.12, cy-Math.sin(ang)*R*0.12);
  ctx.lineTo(cx+Math.cos(ang)*R*0.74, cy+Math.sin(ang)*R*0.74); ctx.stroke();
  ctx.fillStyle='#e8ecf5'; ctx.beginPath(); ctx.arc(cx,cy,R*0.09,0,6.283); ctx.fill();

  // цифры
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(R*0.34)}px Trebuchet MS, sans-serif`;
  ctx.fillText(Math.round(kmh), cx, cy - R*0.34);
  ctx.fillStyle='#8ea0bd'; ctx.font=`bold ${Math.round(R*0.15)}px Trebuchet MS, sans-serif`;
  ctx.fillText('KM/H', cx, cy - R*0.12);

  // индикатор турбо
  if (p1.maxTurbo){
    const tw = R*1.5, th = 7, tx = cx - tw/2, ty = cy + R*0.3;
    ctx.fillStyle='rgba(0,0,0,.5)'; rr(tx,ty,tw,th,3); ctx.fill();
    ctx.fillStyle = p1.boosting ? '#ffd23f' : '#35e0ff';
    rr(tx, ty, tw*clamp(p1.turbo/p1.maxTurbo,0,1), th, 3); ctx.fill();
  }
  ctx.restore();
}

function hud(){
  if (game.state!=='play') return;
  const t = Math.max(0, Math.ceil(game.time/60));
  document.getElementById('pTime').textContent = Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  const order = game.modeType!=='combat' ? ranked() : null;
  for (let i=0;i<2;i++){
    const el = document.getElementById(i===0?'pP1':'pP2');
    const c = game.cars.find(x=>x.pi===i);
    if (!c || !el) continue;
    const bar = el.querySelector('.hpbar i');
    if (game.modeType==='combat'){
      el.querySelector('span').textContent = c.score;
      const p = c.hp/c.maxHp;
      bar.style.width = (p*100)+'%';
      bar.style.background = p>.5?'#49d16b':p>.25?'#ffc93c':'#e8433a';
    } else if (game.modeType==='race'){
      const place = order.indexOf(c)+1;
      el.querySelector('span').textContent = c.finished ? `финиш ${place}` : `круг ${Math.min(c.lap+1,S.КРУГОВ_В_ГОНКЕ)}/${S.КРУГОВ_В_ГОНКЕ} · ${place} место`;
      bar.style.width = '100%'; bar.style.background = '#49d16b';
    } else {
      el.querySelector('span').textContent = c.finished ? `финиш ${(c.finishFrame/60).toFixed(1)}с` : `чекпоинт ${c.cp}/${game.circuit.length}`;
      bar.style.width = (Math.min(1,c.cp/game.circuit.length)*100)+'%'; bar.style.background = '#49d16b';
    }
  }
}

function loop(now){
  requestAnimationFrame(loop);
  if (now < freezeUntil){ render(); return; }        // стоп-кадр при ударе
  if (game.state==='play') { tick(); hud(); }
  render();
}
requestAnimationFrame(loop);

/* ---------------- ЭКРАНЫ / МЕНЮ ---------------- */
const UI = {
  show(id){
    for (const s of document.querySelectorAll('.screen')) s.classList.remove('on');
    if (id) document.getElementById(id).classList.add('on');
    if (id==='scMenu'){
      document.getElementById('coinLine').textContent = '🪙 Джон.А: ' + save.coins;
      document.getElementById('recLine').textContent = save.best ? 'Рекорд: ' + save.best : '';
      game.state='menu'; document.getElementById('hud').classList.remove('on');
    }
  },
  play(){ audio(); this.buildSetup(); this.show('scSetup'); },
  buildSetup(){
    const mr = document.getElementById('modeRow'); mr.innerHTML='';
    for (const m of MODES){
      const b=document.createElement('button');
      b.className='btn sm'+(game.mode===m.id?' g':'');
      b.textContent = m.name + (m.ready?'':' 🔒');
      b.onclick=()=>{ if(!m.ready){ alert('Этот режим ещё делаем!'); return; }
                      game.mode=m.id; this.buildSetup(); };
      mr.appendChild(b);
    }
    const ar = document.getElementById('arenaRow'); ar.innerHTML='';
    ARENAS.forEach((a,i)=>{
      const b=document.createElement('button');
      b.className='btn sm'+(game.arenaIdx===i?' y':'');
      b.textContent=a.name;
      b.onclick=()=>{ game.arenaIdx=i; this.buildSetup(); };
      ar.appendChild(b);
    });
  },
  setPlayers(n){ game.players=n; this.buildSetup(); },
  start(){ startMatch(); },

  /* ---------------- ГАРАЖ ---------------- */
  garage(){ this.show('scGarage'); this.renderGarage(); },
  renderGarage(){
    const def = CARS.find(c=>c.id===save.car) || CARS[0];
    const color = save.color || def.color;
    document.getElementById('garCarName').textContent = def.name;

    // мини-превью машины
    const cv2 = document.getElementById('garPreview'), c2 = cv2.getContext('2d');
    c2.clearRect(0,0,cv2.width,cv2.height);
    drawMiniCar(c2, cv2.width/2, cv2.height/2, 2.1, color, def);

    // цвета
    const cr = document.getElementById('garColors'); cr.innerHTML='';
    COLORS.forEach(col=>{
      const b = document.createElement('button');
      b.className='btn sm'; b.style.minWidth='0'; b.style.width='38px'; b.style.height='38px';
      b.style.padding='0'; b.style.background=col;
      b.style.boxShadow = (col===color) ? '0 0 0 3px #ffd23f' : '0 3px 0 rgba(0,0,0,.35)';
      b.onclick=()=>{ save.color=col; persist(); this.renderGarage(); };
      cr.appendChild(b);
    });

    // тюнинг: скорость / ускорение / прочность / турбо
    const stats = [ ['spd','СКОРОСТЬ'], ['acc','УСКОРЕНИЕ'], ['hp','ПРОЧНОСТЬ'], ['turbo','ТУРБО'] ];
    const box = document.getElementById('garStats'); box.innerHTML='';
    for (const [key,label] of stats){
      const lvl = save.up[key];
      const max = lvl >= S.МАКС_УРОВЕНЬ_ТЮНИНГА;
      const cost = Math.round(S.ЦЕНА_ТЮНИНГА_БАЗА * Math.pow(S.ЦЕНА_ТЮНИНГА_РОСТ, lvl));
      const dots = Array.from({length:S.МАКС_УРОВЕНЬ_ТЮНИНГА}, (_,i)=>
        `<span style="display:inline-block;width:16px;height:8px;margin-right:3px;border-radius:2px;
         background:${i<lvl?'#ffd23f':'#2a3247'}"></span>`).join('');
      const row = document.createElement('div');
      row.className='line'; row.style.alignItems='center';
      const afford = save.coins>=cost;
      row.innerHTML = `<span>${label}<br>${dots}</span>` +
        (max ? `<b style="color:#49d16b">МАКС</b>`
             : `<button class="btn sm y" style="min-width:0;${afford?'':'opacity:.4'}" ${afford?'':'disabled'}>🪙 ${cost}</button>`);
      if (!max){
        row.querySelector('button').onclick=()=>{
          if (save.coins < cost) return;
          save.coins -= cost; save.up[key]++; persist(); this.renderGarage();
        };
      }
      box.appendChild(row);
    }
  },

  /* ---------------- МАГАЗИН ---------------- */
  shop(){ this.show('scShop'); this.renderShop(); },
  renderShop(){
    document.getElementById('shopCoins').textContent = '🪙 У тебя: ' + save.coins;
    const list = document.getElementById('shopList'); list.innerHTML='';
    for (const def of CARS){
      const owned = save.owned.includes(def.id);
      const selected = save.car===def.id;
      const card = document.createElement('div');
      card.className='line'; card.style.alignItems='center';
      const bars = ['spd','acc','hp'].map(k=>{
        const v = clamp(def[k],0.6,1.5), pct = Math.round((v-0.6)/0.9*100);
        return `<div style="width:70px;height:6px;background:#2a3247;border-radius:3px;display:inline-block;margin-right:4px;overflow:hidden">
                  <div style="width:${pct}%;height:100%;background:${def.color}"></div></div>`;
      }).join('');
      let action;
      if (selected) action = `<b style="color:#49d16b">ВЫБРАН</b>`;
      else if (owned) action = `<button class="btn sm g" style="min-width:0">ВЫБРАТЬ</button>`;
      else if (save.coins>=def.price) action = `<button class="btn sm y" style="min-width:0">🪙 ${def.price}</button>`;
      else action = `<span style="color:#5c6785;font-size:13px">не хватает ${def.price-save.coins} 🪙</span>`;
      card.innerHTML = `<span><b style="color:${def.color}">${def.name}</b><br>${bars}</span>${action}`;
      const btn = card.querySelector('button');
      if (btn){
        btn.onclick = ()=>{
          if (owned){ save.car=def.id; } else { save.coins-=def.price; save.owned.push(def.id); save.car=def.id; }
          persist(); this.renderShop();
        };
      }
      list.appendChild(card);
    }
  },
};

/* Превью машины в гараже — ровно та же отрисовка, что и в бою, только без мира */
function drawMiniCar(c2, cx, cy, s, color, def){
  const L = def.len||60, Wd = def.wid||34, HGT = S.ВЫСОТА_МАШИНЫ, T = 0.6;
  const prev = ctx;
  ctx = c2;                                    // рисуем теми же функциями скина
  try {
    c2.save();
    c2.translate(cx, cy + 16); c2.scale(s, s);

    // тень на «земле»
    c2.fillStyle='rgba(0,0,0,.4)';
    c2.beginPath(); c2.ellipse(2, 4, L*0.52, Wd*0.5*T, 0, 0, 6.283); c2.fill();

    // колёса
    for (const sx of [-1,1]) for (const sy of [-1,1]){
      c2.save(); c2.transform(1, 0, 0, T, sx*L*0.29, sy*(Wd*0.5)*T);
      c2.fillStyle='#0d0f14'; rr(-L*0.10, -Wd*0.10, L*0.20, Wd*0.20, 3); c2.fill();
      c2.restore();
    }
    // объём кузова — та же экструзия силуэта
    for (let d = HGT; d >= 0; d -= 2){
      c2.save(); c2.transform(1, 0, 0, T, 0, -d);
      c2.fillStyle = shade(color, 0.42 + (1 - d/HGT)*0.26);
      carBodyPath(L, Wd); c2.fill();
      c2.restore();
    }
    // крыша со скином
    c2.save(); c2.transform(1, 0, 0, T, 0, -HGT);
    drawCarSkin({}, def, color, L, Wd, false);
    c2.restore();

    c2.restore();
  } finally { ctx = prev; }
}
UI.show('scMenu');

/* полноэкранный режим по первому касанию на телефоне */
addEventListener('touchend', function once(){
  const el=document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  removeEventListener('touchend', once);
});
